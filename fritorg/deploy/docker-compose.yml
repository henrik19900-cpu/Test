# Production: Fritorg behind Caddy (automatic HTTPS). Usage:
#   cp .env.example .env   # fill in domain, BankID, e-mail, secret key
#   docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - fritorg-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fritorg-data:
  caddy-data:
  caddy-config:
