{% extends "base.html" %}

{% block title %}Logg inn – {{ site_name }}{% endblock %}

{% block content %}
<div class="narrow">
  <h1>Logg inn</h1>
  {% if error %}<p class="error-summary" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/logg-inn" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="neste" value="{{ next }}">
    <div class="field">
      <label for="email">E-post</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ values.email or '' }}">
    </div>
    <div class="field">
      <label for="password">Passord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="button button-primary button-block">Logg inn</button>
  </form>
  <p>Ny her? <a href="/registrer{% if next and next != '/' %}?neste={{ next|urlencode }}{% endif %}">Lag en gratis konto</a>.</p>
</div>
{% endblock %}
