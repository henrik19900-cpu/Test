# Parallel corpus: the same content in four forms.
#
#   en     natural English, written as a careful writer would (not padded)
#   tele   telegraphic English: articles, copulas and auxiliaries dropped, inflection kept
#   nb     natural Norwegian (bokmål); not "no", which YAML reads as false
#   klar   Klar, carrying the same information as en: no more, no less
#
# Klar sometimes states what English leaves implicit (that a directive is a requirement, that a claim is a
# guess). Where English says it, Klar says it too; where English does not, Klar does not add it, so the
# token counts compare equal information. Every klar entry must parse without errors (tests/test_corpus.py).

