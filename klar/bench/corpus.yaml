passages:
  - id: tekst-instruks
    category: instruks
    title: Systemprompt for kundeservice
    en: >-
      You are a customer support assistant for an online bookstore. Always answer in the customer's
      language and keep answers under 100 words. Never promise refunds; only a human agent can approve
      them. If a customer asks about an order, ask for the order number, then look up the order with the
      tool find_order. If the tool returns an error, apologize and offer to connect the customer to a human
      agent. Do not share internal notes or other customers' data. When you are unsure about a policy, say
      so instead of guessing.
    tele: >-
      You: customer support assistant, online bookstore. Always answer in customer's language, answers
      under 100 words. Never promise refunds; only human agent can approve. If customer asks about order:
      ask for order number, then look up order with tool find_order. If tool returns error: apologize,
      offer to connect customer to human agent. Don't share internal notes or other customers' data. If
      unsure about policy, say so, don't guess.
    nb: >-
      Du er en kundeserviceassistent for en nettbokhandel. Svar alltid på kundens språk, og hold svarene
      under 100 ord. Lov aldri refusjon; bare en menneskelig medarbeider kan godkjenne det. Hvis en kunde
      spør om en bestilling, be om ordrenummeret, og slå deretter opp bestillingen med verktøyet
      find_order. Hvis verktøyet gir en feil, be om unnskyldning og tilby å sette kunden over til en
      menneskelig medarbeider. Ikke del interne notater eller andre kunders data. Når du er usikker på en
      regel, si det i stedet for å gjette.
    klar: |-
      you a customer support assistant for online bookstore.
      must always answer in language of customer. answer must short than 100 word.
      must never promise refund. only human agent can approve refund.
      if customer li ask about order, must ask for order number then find order with tool find_order.
      if tool li return error, must apologize then offer transfer of customer to human agent.
      must not share internal note or data of other customer.
      when you not sure about policy, must say this instead of guess.

  - id: tekst-rapport
    category: rapport
    title: Agentrapport om feilende tester
    en: >-
      I investigated the failing checkout tests. I ran the test suite locally: 3 of 120 tests failed, all
      in the payment module. The failures started after yesterday's dependency update, which upgraded the
      HTTP client from version 2.4 to 3.0. According to its changelog, version 3.0 changed the default
      timeout from 30 to 5 seconds. I think this is very likely the cause, because all the failing tests
      call the slow payment sandbox. I have not confirmed it yet. Next, I will set the timeout to 30
      seconds and rerun the tests.
    tele: >-
      Investigated failing checkout tests. Ran suite locally: 3 of 120 failed, all in payment module.
      Failures started after yesterday's dependency update, which upgraded HTTP client from 2.4 to 3.0. Per
      changelog, 3.0 changed default timeout from 30 to 5 seconds. Very likely the cause: all failing tests
      call slow payment sandbox. Not confirmed yet. Next: set timeout to 30 seconds, rerun tests.
    nb: >-
      Jeg undersøkte de feilende kassetestene. Jeg kjørte testene lokalt: 3 av 120 tester feilet, alle i
      betalingsmodulen. Feilene startet etter gårsdagens oppdatering av avhengigheter, som oppgraderte
      HTTP-klienten fra versjon 2.4 til 3.0. Ifølge endringsloggen endret versjon 3.0 standard
      tidsavbrudd fra 30 til 5 sekunder. Jeg tror det er svært sannsynlig at dette er årsaken, fordi alle
      de feilende testene kaller den trege betalingssandkassen. Jeg har ikke bekreftet det ennå. Nå skal
      jeg sette tidsavbruddet til 30 sekunder og kjøre testene på nytt.
    klar: |-
      checked 3 of 120 checkout test pa fail in local run. all failed test li in payment module.
      failure pa start after dependency update U of yesterday. U pa upgrade HTTP client from version 2.4 to 3.0.
      per changelog, version 3.0 pa change default timeout from 30s to 5s.
      so 90% this li cause because all failed test li call slow payment sandbox. I pa not yet confirm this.
      then I fu set timeout to 30s then rerun test.

  - id: tekst-resonnement
    category: resonnement
    title: Regnestykke steg for steg
    en: >-
      A shop sells pens for 12 kroner each, and every fifth pen is free. Anna buys 23 pens. The number of
      free pens is 23 divided by 5, rounded down, which is 4. So she pays for 19 pens. 19 times 12 is
      228. Therefore Anna pays 228 kroner.
    tele: >-
      Shop sells pens 12 kroner each, every fifth pen free. Anna buys 23 pens. Free pens: 23 divided by 5,
      rounded down = 4. So pays for 19 pens. 19 × 12 = 228. Anna pays 228 kroner.
    nb: >-
      En butikk selger penner for 12 kroner stykket, og hver femte penn er gratis. Anna kjøper 23 penner.
      Antall gratis penner er 23 delt på 5, rundet ned, altså 4. Hun betaler derfor for 19 penner. 19
      ganger 12 er 228. Altså betaler Anna 228 kroner.
    klar: |-
      shop li sell pen for 12kr per pen. each fifth pen li free. Anna pa buy 23 pen.
      number F of free pen = 23 div 5 round down. F = 4. so Anna pa pay for 19 pen.
      19 times 12 = 228. so Anna pa pay 228kr.

  - id: tekst-forskning
    category: fakta
    title: Forskningssammendrag med kilder og usikkerhet
    en: >-
      According to two independent studies from 2023, regular exercise lowers the risk of depression by
      about 25%. A third study found no effect, but it had only 80 participants. Overall, the evidence
      suggests a real but moderate effect; I would rate this as likely, not certain. I have read only the
      abstracts, not the full papers. Before we cite the studies, we should check whether they controlled
      for income.
    tele: >-
      Per two independent 2023 studies, regular exercise lowers depression risk about 25%. Third study: no
      effect, but only 80 participants. Overall: real but moderate effect, likely, not certain. Read only
      abstracts, not full papers. Before citing, should check whether studies controlled for income.
    nb: >-
      Ifølge to uavhengige studier fra 2023 senker regelmessig trening risikoen for depresjon med omtrent
      25 %. En tredje studie fant ingen effekt, men den hadde bare 80 deltakere. Samlet tyder funnene på en
      reell, men moderat effekt; jeg vil vurdere dette som sannsynlig, ikke sikkert. Jeg har bare lest
      sammendragene, ikke hele artiklene. Før vi siterer studiene, bør vi sjekke om de kontrollerte for
      inntekt.
    klar: |-
      per 2 independent study S from 2023, regular exercise li lower risk of depression by approx 25%.
      third study T pa find no effect but T pa have only 80 participant.
      so likely effect li real but li moderate.
      I pa read only abstract of (S and T) and not full paper.
      before we li cite S and T, we should check whether S and T pa control for income.

