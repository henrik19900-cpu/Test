# Klar Kort (docs/kort.en.md): the corpus in bench/corpus.yaml, compressed.
#
#   kort      as short as possible while keeping every fact in eval/kort/facts.yaml (version 2)
#   kort_v1   the first attempt, where it differs; it lost 7 % of the facts (eval/kort/RESULTS.md)
#   kort200   the whole corpus squeezed into at most 200 tokens: only the main point of each text survives
#
# eval/kort/ measures how many facts fresh models get back from each version.

