# survive. Written from the English originals. A decoded text is scored fact by fact (score.py).

instruks-01:
  - Always answer in Norwegian.
  - Keep the answer short.
instruks-02:
  - Do not use technical jargon.
  - "Exception: jargon is allowed if the user asks for it."
instruks-03:
  - This applies when the user uploads a file.
  - Read all of the file.
  - Read it carefully.
  - Do this before answering.
instruks-04:
  - Never share the user's password.
  - With anyone; this is an absolute rule.
instruks-05:
  - Cite sources for each factual claim.
  - At least two sources.
  - This is a recommendation (should), not a strict requirement.
instruks-06:
  - Write the summary as a bulleted list.
  - At most five points.
instruks-07:
  - Check whether the input is valid JSON.
  - Do this check first.
  - If the input is not valid JSON, return an error message.
instruks-08:
  - Respond only with the corrected code.
  - Give no explanation.
instruks-09:
  - Ask the user for confirmation.
  - Before deleting any files.
instruks-10:
  - Accuracy is more important than speed.
  - If you do not know something, say so.
  - Do not guess.
