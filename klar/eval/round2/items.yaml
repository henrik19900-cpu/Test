# Held-out test set, round 2: new sentences, tested with the primer after the fixes from round 1.
# The fixes target the mistakes seen in round 1, so these items test them again on new sentences, together
# with harder cases (which "it" means, scope of not, xor, chains of instructions).
comprehension:
  - id: D1
    klar: "script pa delete file and it pa crash."
    gold: "The script deleted the file, and the file crashed (by the it-rule: it = the nearest subject or object, here the object 'file')."
    key: "it = the file, not the script"
  - id: D2
    klar: "user pa open file and admin pa close it."
    gold: "The user opened the file and the admin closed the file."
    key: "it = the file (never the subject of its own verb, so not the admin)"
  - id: D3
    klar: "server A xor server B must active."
    gold: "Exactly one of server A and server B must be active."
    key: "exactly one, not both"
  - id: D4
    klar: "not all test pa pass."
    gold: "Not every test passed (at least one failed)."
    key: "some failed; not 'none passed'"
  - id: D5
    klar: "all agent pa not read report."
    gold: "No agent read the report (each agent did not read it)."
    key: "none of the agents read it"
  - id: D6
    klar: "per monitor, CPU li 95% since 10:00. so likely job J li stuck. must restart J if J li still stuck at 11:00."
    gold: "According to the monitor, CPU has been at 95% since 10:00. So (inferred) job J is probably (~75%) stuck. You must restart J if it is still stuck at 11:00."
    key: "first claim from the monitor; second inferred, ~75%; restart required only if still stuck at 11:00"
production:
