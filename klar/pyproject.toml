[project]
name = "klar"
version = "1.0.0"
description = "Klar – et kompakt og entydig skriftspråk for AI, med parser, sjekker og målinger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the language tools need only the standard library

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",  # the corpus and evaluation files
]
# Token counting in bench/: tiktoken for the OpenAI encodings, tokenizers + huggingface_hub for the rest.
bench = [
    "tiktoken>=0.7",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
    "pyyaml>=6",
]

[project.scripts]
klar = "klar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long strings are fine
