# Odds-sammenligner. Stier er relative til mappen denne filen ligger i.

days_ahead: 7               # kommende kamper så mange dager frem
interval_minutes: 15        # hvor ofte `oddscompare run` henter (aldri under 5)
margin_method: proportional # proportional | power | shin
match_window_minutes: 30    # avsparkstid må stemme innenfor ± dette
fuzzy_accept: 90            # fuzzy-treff fra og med denne scoren brukes
fuzzy_suggest: 80           # treff fra denne opp til fuzzy_accept logges bare som forslag
stale_after_minutes: 30     # dashboardet varsler når Norsk Tipping-oddsen er eldre enn dette
user_agent: "odds-compare/0.1 (personlig analyseverktoy)"

database: data/odds.db
aliases: data/team_aliases.yaml
cache_dir: data/cache

norsk_tipping:
  min_interval_minutes: 5   # oftere enn dette brukes siste svar fra cachen
  navigation_cache_hours: 6 # ligatreet endres sjelden og hentes på nytt etter så mange timer
  # Land eller grupper i Oddsens fotballmeny. Tom liste = alle (rundt 200 kall første gang).
  countries: [Norge, England, Spania, Tyskland, Italia, Frankrike, Sverige, Danmark, Nederland, Europa]
  base_url: https://www.norsk-tipping.no/sport/oddsen/sportsbook/services
  websocket_url: wss://velnt-opr1.sport2.norsk-tipping.no/notification/listen
  timeout_seconds: 25

reference:
  source: the_odds_api      # the_odds_api (gratis) | odds_api_io (betalt)
  the_odds_api:
    base_url: https://api.the-odds-api.com/v4
    bookmaker: pinnacle     # eller betfair_ex_eu
    # Norsk Tippings konkurrenter, hentet i samme forespørsel uten ekstra kostnad (høyst 9).
    competitors: [unibet_se, betsson, nordicbet, coolbet, leovegas_se, sport888, betway]
    # Ligaer (sport keys fra GET /v4/sports): alle Norsk Tipping-ligaene The Odds API dekker.
    # Referanseodds hentes bare når du ber om det (`oddscompare reference` eller knappen i
    # dashboardet, der du kan velge færre ligaer). Hver liga koster 1 kreditt per henting, bare når
    # den har kamper som kan matche Norsk Tipping. Gratisplanen har 500 i måneden.
    leagues:
      - soccer_norway_eliteserien               # Eliteserien
      - soccer_epl                              # Premier League
      - soccer_efl_champ                        # Championship
      - soccer_england_league1                  # League One
      - soccer_england_league2                  # League Two
      - soccer_uefa_champs_league               # Champions League
      - soccer_uefa_europa_league               # Europa League
      - soccer_uefa_europa_conference_league    # Conference League
      - soccer_spain_la_liga                    # LaLiga
      - soccer_spain_segunda_division           # LaLiga 2
      - soccer_italy_serie_a                    # Serie A
      - soccer_italy_serie_b                    # Serie B
      - soccer_germany_bundesliga               # Bundesliga
      - soccer_germany_bundesliga2              # 2. Bundesliga
      - soccer_germany_liga3                    # 3. Liga
      - soccer_france_ligue_one                 # Ligue 1
      - soccer_france_ligue_two                 # Ligue 2
      - soccer_netherlands_eredivisie           # Eredivisie
      - soccer_sweden_allsvenskan               # Allsvenskan
      - soccer_sweden_superettan                # Superettan
      - soccer_denmark_superliga                # Superligaen
    min_interval_minutes: 5   # en ny forespørsel innen så mange minutter gjenbruker forrige svar
  odds_api_io:
    base_url: https://api.odds-api.io/v3
    bookmaker: Betfair Exchange
    leagues: []             # ligaslugs, f.eks. norway-eliteserien; tom = alle med odds hos bookmakeren

# `oddscompare watch` (GitHub Actions hvert 15. minutt): når referanseodds kjøpes, og hva som gir varsel.
alerts:
  min_ev: 0.02                # varsel når EV mot Pinnacle er minst 2 %
  max_reference_margin: 0.06  # og Pinnacles egen margin er høyst 6 %
  lead_minutes: 75            # referanseodds kjøpes for kamper som starter innen så mange minutter
  nt_jump: 0.05               # eller når Norsk Tipping hever oddsen 5 % siden forrige sjekk
  fresh_minutes: 30           # varsler bare på referanseodds som er høyst så gamle
  max_credits_per_day: 20
  reserve_credits: 30         # de siste kredittene i måneden brukes aldri av overvåkeren
  ntfy_server: https://ntfy.sh
  # Åpnes når du trykker på varselet eller knappen «Åpne odds-siden»: forhåndsvisningen i Claude (viser
  # oddsen fra siste gang den ble oppdatert). Bytt gjerne til Streamlit-appens adresse, som alltid er fersk.
  app_url: "https://claude.ai/artifact/3mQmFyoULT9TofNghC3NdV"
  keep_days: 7                # så lenge overvåkeren tar vare på ferdigspilte kamper
  days_ahead: 2               # så langt frem overvåkeren leser Norsk Tipping
