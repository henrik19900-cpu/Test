# Kanonisk navn: [varianter]. Navnene sammenlignes etter normalisering (små bokstaver, ø → o,
# å → a, æ → ae, uten «FK», «IL», «FC», «BK», «IF» og lignende), så «Bodø/Glimt», «Bodo Glimt»
# og «FK Bodø/Glimt» er allerede like og trenger ingen linje her.
# Nye linjer kan kopieres fra fanen «Umatchede kamper» i dashboardet.

